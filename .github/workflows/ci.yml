name: Neuro AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@041b854f97b325bd60e53e9dc2de9cb9b9ac3cba # v2.0.2
        with:
          deno-version: v2.x

      - name: Type-check, test, and build
        run: npm run check

      - name: Check processing worker
        run: npm run check:worker
