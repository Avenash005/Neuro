name: Neuron CI

on:
  push:
    branches: [main, phase-2-production]
  pull_request:
    branches: [main, phase-2-production]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: npm run check
