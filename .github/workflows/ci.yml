name: Neuro AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@041b854f97b325bd60e53e9dc2de9cb9b9ac3cba # v2.0.2
        with:
          deno-version: v2.x

      - name: Type-check, test, and build
        run: npm run check

      - name: Check processing worker
        run: npm run check:worker
