name: Feature Request
description: Suggest an idea or enhancement for Neuro AI
title: "[Feature]: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check [existing issues](https://github.com/Avenash005/Neuro/issues) to see if a similar feature has already been proposed.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation does this feature address?
      placeholder: E.g., When reviewing code files, the local indexer currently truncates AST symbols...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or capability you would like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
  - type: textarea
    id: benefit
    attributes:
      label: User Benefit
      description: How will this benefit users or contributors of Neuro AI?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What measurable conditions must be met for this feature to be considered complete?
      placeholder: |
        - [ ] User can toggle setting from Privacy Dashboard
        - [ ] Unit tests cover new connector methods
        - [ ] Documentation updated in README
    validations:
      required: true
  - type: dropdown
    id: willingness_to_contribute
    attributes:
      label: Willingness to Contribute
      description: Would you be interested in submitting a pull request for this feature?
      options:
        - "Yes, I would like to implement this myself!"
        - "Yes, with some guidance from maintainers."
        - "No, I am only requesting this feature."
    validations:
      required: false

